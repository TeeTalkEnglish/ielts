<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Business Vocab Booster</title>

  <!-- CSS -->
  <link rel="stylesheet" href="vocab.css">
</head>

<body>

<div class="phone">

  <h1>🚀 Vocab Booster</h1>

  <table>

    <tr>
      <th>Image</th>
      <th>❌ Basic</th>
      <th>✅ Better</th>
    </tr>

    <!-- Coffee Shop -->
    <tr>
      <td>
        <img src="https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=300">
      </td>

      <td>
        <div class="basic">own coffee shop</div>
        <div class="vn">mở quán cà phê</div>
      </td>

      <td class="answer-cell"
          onclick="reveal(this, 'run a coffee shop')">
        reveal
      </td>
    </tr>

    <!-- Clothing Brand -->
    <tr>
      <td>
        <img src="https://images.unsplash.com/photo-1523381210434-271e8be1f52b?w=300">
      </td>

      <td>
        <div class="basic">sell clothes online</div>
        <div class="vn">bán quần áo online</div>
      </td>

      <td class="answer-cell"
          onclick="reveal(this, 'start a clothing brand')">
        reveal
      </td>
    </tr>

    <!-- Nail Industry -->
    <tr>
      <td>
        <img src="https://images.unsplash.com/photo-1610992015732-2449b76344bc?w=300">
      </td>

      <td>
        <div class="basic">do nails</div>
        <div class="vn">làm nail</div>
      </td>

      <td class="answer-cell"
          onclick="reveal(this, 'work in the nail industry')">
        reveal
      </td>
    </tr>

    <!-- TikTok -->
    <tr>
      <td>
        <img src="https://images.unsplash.com/photo-1611605698335-8b1569810432?w=300">
      </td>

      <td>
        <div class="basic">make TikTok videos</div>
        <div class="vn">làm video TikTok</div>
      </td>

      <td class="answer-cell"
          onclick="reveal(this, 'create content on TikTok')">
        reveal
      </td>
    </tr>

    <!-- Bakery -->
    <tr>
      <td>
        <img src="https://images.unsplash.com/photo-1509440159596-0249088772ff?w=300">
      </td>

      <td>
        <div class="basic">bake cakes</div>
        <div class="vn">làm bánh</div>
      </td>

      <td class="answer-cell"
          onclick="reveal(this, 'run a bakery business')">
        reveal
      </td>
    </tr>

    <!-- Beauty -->
    <tr>
      <td>
        <img src="https://images.unsplash.com/photo-1522335789203-aabd1fc54bc9?w=300">
      </td>

      <td>
        <div class="basic">sell makeup</div>
        <div class="vn">bán mỹ phẩm</div>
      </td>

      <td class="answer-cell"
          onclick="reveal(this, 'own a beauty business')">
        reveal
      </td>
    </tr>

  </table>

<div class="watermark">
  TeeTalkEnglish
</div>
</div>

<!-- JS -->
<script src="vocab.js"></script>

</body>
</html>
